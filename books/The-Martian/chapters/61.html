    <h1 id="calibre_pb_0"><span>第十四章</span></h1>
<h2 id="sigil_toc_id_9">语音日志：SOL119</h2>
<p>你瞧这破事！？我操！操这个气闸室，操这个栖息舱，操他妈整颗星球！</p>
<p>说真的，认命吧！我完了！几分钟之后等空气跑光，我也就死翘翘了。还跟火星玩什么过家家，我就是在自寻死路。我真受够了这该死的一切！</p>
<p>我所要做的就是坐在这里等死，等空气全部漏光。</p>
<p>我肯定会完蛋，再也没有希望这回事，没有自我欺骗，没有问题要解决了。我他妈到头了！</p>
