    <h2 id="calibre_pb_7">日志：SOL503</h2>
<p>因为开车时间过长，昨天的充电率没有平日高，夜幕降临时，大约只充满70%。所以，今天的开车时间要压缩一下。</p>
<p>再次扎营之前，我开了63公里。但是我一点也不在意，因为离MAV只有148公里了。也就是说，后天就能到了。</p>
<p>遭天杀的，我真的要做到了！</p>
