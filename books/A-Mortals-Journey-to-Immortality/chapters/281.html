    <p>“《天南手札》第二卷，第四篇！”无游子冷淡的说道。</p>
<p>“啊……”女修士一开始没明白，但片刻后就知道了对方意思。</p>
<p>这是一本各大派都藏有的一整套典籍，专门介绍这片地区一些国家的人情风俗和一些其奇闻趣事的，对修仙界的事情，似乎真有些涉及，但是因为书太多了，女修士只是匆匆看了数本就懒得再去细看了。难道，鬼灵门的事情竟然在这书上能找到吗？</p>
<p>也许是看出了不仅是她，其他几人都露出了疑惑的表情，无游子又勉强开口道：</p>
