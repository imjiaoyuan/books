<p>抗战胜利之后，父母与十个孩子在南京合影，这是唯一的全家福。前排左起：七弟先敬、六弟先刚；中排左起：先勇、母亲马佩璋、父亲白崇禧、四哥先忠；后排左起：三姊先明、二姊先慧、大姊先智、大哥先道、二哥先德、三哥先诚。</p>
